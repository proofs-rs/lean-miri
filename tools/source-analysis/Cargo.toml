[package]
name = "lean-miri-source-analysis"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
proc-macro2 = { version = "=1.0.103", features = ["span-locations"] }
quote = "=1.0.41"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
syn = { version = "=2.0.108", features = ["full", "visit", "extra-traits"] }
