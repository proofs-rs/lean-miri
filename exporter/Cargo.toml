[package]
name = "lean-miri-rustc-mir-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "lean-miri-mir-exporter"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = "1.0"
miri = { path = "../upstream/miri-source", default-features = false, optional = true }

[features]
default = []
# Reference builder/encoder for output and performance comparisons.
legacy-json = []
# Reference producer for differential checks of operation-directed type queries.
full-type-queries = []
# Differential producer for fully materialized caller-location constants.
full-caller-locations = []
# Reference encoding of the same allocation-world facts.
full-allocation-world = []
miri-reference = ["dep:miri"]
