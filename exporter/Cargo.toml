[package]
name = "lean-miri-rustc-mir-exporter"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "lean-miri-mir-exporter"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = "1.0"
miri = { path = "../upstream/miri-source", default-features = false, optional = true }

[features]
default = []
# Reference builder/encoder for output and performance comparisons.
legacy-json = []
# Reference producer for differential checks of operation-directed type queries.
full-type-queries = []
# Full in-process execution-IR experiment; uses the separately built Lean library.
execution-ir = []
miri-reference = ["dep:miri"]
