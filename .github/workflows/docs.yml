name: Miri API documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ELAN_HOME: ${{ github.workspace }}/.elan
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Lean toolchain
        run: |
          bash tools/setup-lean.sh
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Build API reference
        working-directory: docbuild
        run: flock /tmp/lean-miri-lake-build.lock lake build MiriApi:docs
      - name: Check generated entry points
        run: |
          test -s docbuild/.lake/build/doc/index.html
          test -s docbuild/.lake/build/doc/Miri.html
          test -s docbuild/.lake/build/doc/Miri/Frontend/ImportMIR.html
          test -s docbuild/.lake/build/doc/Miri/Input/ExecutionChoicePolicy.html
          test -s docbuild/.lake/build/doc/Miri/Interpreter/TlsCallbacks.html
          test -s docbuild/.lake/build/doc/declarations/declaration-data.bmp
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy API reference
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
