name: Miri regression

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [regression, extended, replay]
    env:
      LEAN_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Free unused SDK disk space
        if: matrix.lane != 'replay'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test CI runner
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Prepare pinned tools and reference
        run: |
          mkdir -p scratch/ci
          /usr/bin/time -v bash tools/ci/setup.sh '${{ matrix.lane }}' 2>&1 | tee scratch/ci/setup.log
      - name: Run comparisons and assertions
        run: python3 tools/ci/run.py '${{ matrix.lane }}'
      - name: Retain results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miri-${{ matrix.lane }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            scratch/ci/
            scratch/logs/
            scratch/connected-runs/**/*.log
            scratch/connected-runs/**/*.result.json
            scratch/connected-runs/**/*.validation.json
            scratch/connected-runs/**/ordering-result.json
            scratch/sc-schedules/**/*.log
            scratch/sc-schedules/**/seed-*.json
            scratch/ci-fresh/**/*.log
