name: Miri regression

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [regression, extended, replay]
    env:
      LEAN_NUM_THREADS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Free unused SDK disk space
        if: matrix.lane != 'replay'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test CI runner
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Install comparison test dependencies
        if: matrix.lane != 'replay'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Compute compatible Lean cache key
        id: lean-cache-key
        run: |
          abi=$( { cc --version; ld --version; printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"; } | sha256sum | cut -d ' ' -f 1)
          echo "prefix=lean-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${abi}-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json', 'native/**') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore Lean build artifacts
        id: lean-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ steps.lean-cache-key.outputs.prefix }}${{ hashFiles('Miri.lean', 'Miri/**/*.lean', 'MiriTests.lean', 'MiriTests/**/*.lean', 'tools/*.lean') }}
          restore-keys: ${{ steps.lean-cache-key.outputs.prefix }}
      - name: Prepare pinned tools and reference
        run: |
          mkdir -p scratch/ci
          export CI_TIMING_FILE="$PWD/scratch/ci/setup.steps.jsonl"
          /usr/bin/time -v bash tools/ci/setup.sh '${{ matrix.lane }}' 2>&1 | tee scratch/ci/setup.log
      - name: Run comparisons and assertions
        env:
          CI_LEAN_CACHE_HIT: ${{ steps.lean-cache.outputs.cache-hit }}
          CI_LEAN_CACHE_KEY: ${{ steps.lean-cache.outputs.cache-primary-key }}
          CI_LEAN_CACHE_RESTORED_KEY: ${{ steps.lean-cache.outputs.cache-matched-key }}
        run: python3 tools/ci/run.py '${{ matrix.lane }}'
      - name: Save successful Lean build artifacts
        if: success() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lake/build
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
      - name: Retain results and diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miri-${{ matrix.lane }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            scratch/ci/
            scratch/logs/
            scratch/connected-runs/**/*.log
            scratch/connected-runs/**/*.result.json
            scratch/connected-runs/**/*.validation.json
            scratch/connected-runs/**/ordering-result.json
            scratch/sc-schedules/**/*.log
            scratch/sc-schedules/**/seed-*.json
            scratch/ci-fresh/**/*.log
            scratch/connected-libc-target/build.jsonl
            scratch/connected-libc-target/libc-rlib.path
